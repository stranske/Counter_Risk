# Builds a versioned Windows operator bundle using PyInstaller.
# Downloads the artifact from the GitHub Actions run summary page.
#
# Trigger modes:
# - Manual dispatch (workflow_dispatch)
# - Push of a version tag (e.g. v0.1.0)

name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build from (defaults to the current branch)"
        required: false
        default: ""
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-launcher-smoke:
    name: Smoke Windows GUI launcher
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Exercise assembled GUI launcher and deliberate break
        shell: pwsh
        run: >-
          ./scripts/windows/smoke_gui_launcher.ps1
          -LauncherPath ./run_counter_risk_gui.cmd
          -EvidenceDirectory "${{ runner.temp }}/gui-launcher-evidence"

      - name: Upload GUI launcher evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: counter-risk-gui-launcher-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gui-launcher-evidence/
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows bundle
    needs: gui-launcher-smoke
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Assemble release bundle
        run: >
          python -m counter_risk.build.release
          --version-file VERSION
          --output-dir release
          --force

      - name: Verify bundle contents
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE="release/${VERSION}"
          for path in \
            "${BUNDLE}/VERSION" \
            "${BUNDLE}/manifest.json" \
            "${BUNDLE}/counter_risk_runner.xlsm" \
            "${BUNDLE}/run_counter_risk.cmd" \
            "${BUNDLE}/run_counter_risk_gui.cmd" \
            "${BUNDLE}/request_counter_risk_remote.cmd" \
            "${BUNDLE}/process_counter_risk_remote.cmd" \
            "${BUNDLE}/remote_trigger_testing.md" \
            "${BUNDLE}/README_HOW_TO_RUN.md" \
            "${BUNDLE}/bin/counter-risk.exe"
          do
            if [ ! -e "$path" ]; then
              echo "MISSING: $path" && exit 1
            fi
            echo "OK: $path"
          done

      - name: Stage candidate bundle for isolated smoke
        uses: actions/upload-artifact@v7
        with:
          name: counter-risk-windows-candidate
          overwrite: true
          path: |
            release/${{ steps.version.outputs.version }}/
            scripts/windows/smoke_assembled_release.ps1
          if-no-files-found: error
          retention-days: 1

  smoke-windows:
    name: Smoke Windows bundle without checkout or Python setup
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Download candidate bundle and smoke harness
        uses: actions/download-artifact@v8
        with:
          name: counter-risk-windows-candidate
          path: candidate

      - name: Smoke assembled Windows executable
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build-windows.outputs.version }}
        run: >
          ./candidate/scripts/windows/smoke_assembled_release.ps1
          -Bundle "candidate/release/$env:RELEASE_VERSION"
          -EvidenceDirectory "release-smoke-evidence"

      - name: Upload executable smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: counter-risk-windows-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-smoke-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: counter-risk-${{ needs.build-windows.outputs.version }}-windows
          overwrite: true
          path: candidate/release/${{ needs.build-windows.outputs.version }}/
          if-no-files-found: error
          retention-days: 30
